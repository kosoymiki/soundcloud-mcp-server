name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["24"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install ffmpeg (best effort, bounded)
        timeout-minutes: 4
        shell: bash
        run: |
          set -uo pipefail
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg already present: $(ffmpeg -version | head -1)"
            exit 0
          fi
          for attempt in 1 2 3; do
            echo "apt attempt ${attempt}"
            if sudo timeout 90 apt-get update -qq && sudo timeout 90 apt-get install -y --no-install-recommends ffmpeg; then
              break
            fi
            sleep 5
          done
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg installed: $(ffmpeg -version | head -1)"
          else
            echo "::warning::ffmpeg unavailable; audio integration tests will be skipped"
          fi
      - run: npm run typecheck
      - name: Test (per file, bounded)
        shell: bash
        run: |
          set -uo pipefail
          status=0
          for file in tests/*.test.ts; do
            echo "::group::${file}"
            if ! timeout 240 node --import tsx --test --test-timeout=120000 --test-force-exit "${file}"; then
              status=1
              echo "::error::${file} failed or timed out"
              echo "::endgroup::"
              break
            fi
            echo "::endgroup::"
          done
          exit "${status}"
      - run: npm run build

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: soundcloud-mcp-server:ci
