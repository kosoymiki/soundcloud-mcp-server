name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["24"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install ffmpeg (optional, non-blocking)
        continue-on-error: true
        timeout-minutes: 3
        shell: bash
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg already present"
            exit 0
          fi
          # No apt-get update: the runner image already has package lists, and a
          # mirror stall must never fail the build (audio tests skip themselves).
          sudo timeout 120 apt-get install -y --no-install-recommends ffmpeg \
            || echo "::warning::ffmpeg unavailable; audio integration tests will be skipped"
      - run: npm run typecheck
      - run: npm run build
      - name: Test (per file, bounded)
        shell: bash
        run: |
          set -uo pipefail
          status=0
          for file in tests/*.test.ts; do
            echo "::group::${file}"
            if ! timeout 240 node --import tsx --test --test-timeout=120000 --test-force-exit "${file}"; then
              status=1
              echo "::error::${file} failed or timed out"
              echo "::endgroup::"
              break
            fi
            echo "::endgroup::"
          done
          exit "${status}"
      - name: E2E user journey (mock SoundCloud)
        run: npm run e2e


  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: soundcloud-mcp-server:ci
