name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["24"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install ffmpeg (audio-lab integration tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm run typecheck
      - name: Test (per file, bounded)
        shell: bash
        run: |
          set -uo pipefail
          status=0
          for file in tests/*.test.ts; do
            echo "::group::${file}"
            if ! timeout 240 node --import tsx --test --test-timeout=120000 --test-force-exit "${file}"; then
              status=1
              echo "::error::${file} failed or timed out"
              echo "::endgroup::"
              break
            fi
            echo "::endgroup::"
          done
          exit "${status}"
      - run: npm run build

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: soundcloud-mcp-server:ci
